<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Luopan 3D Pro - Advanced Feng Shui Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- นำเข้าไลบรารีดาราศาสตร์ปฏิทินจีนแบบแม่นยำ 100% -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #020617; color: white; overflow: hidden; touch-action: none; margin: 0; padding: 0; }
        #canvas3dContainer { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #uiLayer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        .glass-panel { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .layer-btn.active { background: rgba(30, 41, 59, 0.9); border-color: #d4af37; color: #fde047; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        input[type="range"] { accent-color: #d4af37; }
        
        #sidebar {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
            opacity: 0;
            box-shadow: none;
        }
        #sidebar.open {
            transform: translateX(0);
            opacity: 1;
            box-shadow: 20px 0 50px rgba(0,0,0,0.5);
        }

        #videoBackground {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: 0; display: none;
        }

        #degreeDisplay {
            top: 50%;
            transform: translate(-50%, calc(-100% - 47vmin));
        }
        @media (max-aspect-ratio: 3/5) { #degreeDisplay { transform: translate(-50%, calc(-100% - 42vw)); } }
        @media (max-aspect-ratio: 9/20) { #degreeDisplay { transform: translate(-50%, calc(-100% - 36vw)); } }
        
        /* สไตล์พิเศษสำหรับตัวอักษรจีน */
        .cn-char { font-family: 'STKaiti', 'KaiTi', 'SimKai', serif; }
    </style>
</head>
<body>
    <video id="videoBackground" autoplay playsinline></video>
    <div id="canvas3dContainer"></div>

    <div id="uiLayer">
        <!-- Top Left Controls -->
        <div id="topLeftControls" class="absolute top-20 left-4 z-30 flex flex-col gap-4 pointer-events-auto transition-opacity duration-300">
            <button id="menuBtn" class="bg-slate-900/95 border-2 border-slate-700 text-yellow-500 p-3 rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.5)] hover:bg-slate-800 transition-all flex items-center justify-center w-12 h-12">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <button id="quickLayerBtn" class="bg-slate-900/95 border-2 border-indigo-500 text-indigo-400 p-3 rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.5)] hover:bg-slate-800 transition-all flex items-center justify-center w-12 h-12" title="สลับโหมดหน้าปัดทั้งหมด">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
            </button>
        </div>

        <!-- Top Right Controls -->
        <div class="absolute top-20 right-4 z-30 flex flex-col gap-4 pointer-events-auto">
            <button id="compassBtn" class="bg-indigo-600/95 text-white p-3 rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.5)] border-2 border-indigo-400 hover:bg-indigo-500 transition-all flex items-center justify-center w-12 h-12">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
            <button id="arBtn" class="bg-slate-800/95 text-emerald-400 p-3 rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.5)] border-2 border-slate-600 hover:bg-slate-700 transition-all flex items-center justify-center w-12 h-12">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
            <button id="importImgBtn" class="bg-slate-800/95 text-blue-400 p-3 rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.5)] border-2 border-slate-600 hover:bg-slate-700 transition-all flex items-center justify-center w-12 h-12 relative overflow-hidden">
                <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
            </button>
            <button id="editImgBtn" class="hidden bg-yellow-600/95 text-white p-3 rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.5)] border-2 border-yellow-400 hover:bg-yellow-500 transition-all flex items-center justify-center w-12 h-12">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
            </button>
        </div>

        <!-- Sidebar ขยายความกว้างเพื่อรองรับ Layout 2 ฝั่ง -->
        <div id="sidebar" class="absolute top-0 left-0 w-[24rem] max-w-[92vw] h-full glass-panel z-40 flex flex-col pointer-events-auto shadow-[20px_0_50px_rgba(0,0,0,0.8)]">
            <div class="flex-shrink-0 bg-slate-900/95 p-4 pt-14 border-b border-slate-700/80 flex justify-between items-center z-10 shadow-md">
                <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-yellow-500 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Luopan 3D Pro
                </h1>
                <button id="closeSidebarBtn" class="text-slate-400 hover:text-white p-2 bg-slate-800 rounded-lg hover:bg-slate-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="flex-shrink-0 flex border-b border-slate-700/80 bg-slate-900/50">
                <button class="tab-btn flex-1 py-3 text-[12px] font-medium text-yellow-400 border-b-2 border-yellow-500 transition-colors" data-tab="config">⚙️ ตั้งค่า (Config)</button>
                <button class="tab-btn flex-1 py-3 text-[12px] font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition-colors" data-tab="analysis">📊 วิเคราะห์ (Analysis)</button>
            </div>

            <!-- Tab Content: Config -->
            <div id="tab-config" class="p-4 space-y-6 flex-1 overflow-y-auto">
                <div class="bg-slate-800/40 rounded-xl p-3 border border-slate-700/50">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-[12px] font-semibold text-yellow-500 flex items-center gap-1.5"><span class="text-slate-400">🕒</span> กาลเวลาจร (Time)</label>
                        <button id="setNowBtn" class="text-[10px] bg-blue-600/80 hover:bg-blue-500 text-white px-2 py-1 rounded">ปัจจุบัน</button>
                    </div>
                    <input type="datetime-local" id="targetDate" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:border-yellow-500 focus:outline-none mb-3">
                    
                    <div class="text-[10px] text-slate-400 mb-1.5 font-medium">เปิดเช็คข้อมูลทิศร้ายกาลเวลา:</div>
                    <div class="grid grid-cols-2 gap-2 text-[11px]">
                        <label class="flex items-center gap-2 bg-slate-900/60 px-2 py-1.5 rounded border border-slate-700"><input type="checkbox" id="togYear" checked class="rounded border-slate-600 bg-slate-800"> <span>ปี (Year)</span></label>
                        <label class="flex items-center gap-2 bg-slate-900/60 px-2 py-1.5 rounded border border-slate-700"><input type="checkbox" id="togMonth" checked class="rounded border-slate-600 bg-slate-800"> <span>เดือน (Month)</span></label>
                        <label class="flex items-center gap-2 bg-slate-900/60 px-2 py-1.5 rounded border border-slate-700"><input type="checkbox" id="togDay" checked class="rounded border-slate-600 bg-slate-800"> <span>วัน (Day)</span></label>
                        <label class="flex items-center gap-2 bg-slate-900/60 px-2 py-1.5 rounded border border-slate-700"><input type="checkbox" id="togHour" checked class="rounded border-slate-600 bg-slate-800"> <span>ยาม (Hour)</span></label>
                    </div>
                </div>

                <div class="bg-slate-800/40 rounded-xl p-3 border border-slate-700/50">
                    <label class="block text-[12px] font-semibold text-yellow-500 mb-3 flex items-center gap-1.5"><span class="text-slate-400">👤</span> ข้อมูลบุคคล (Person)</label>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">วัน/เดือน/ปีเกิด และเวลา</label>
                            <input type="datetime-local" id="birthDate" value="1981-06-25T10:16" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:border-yellow-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">เพศ (Gender)</label>
                            <select id="gender" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:border-yellow-500 focus:outline-none">
                                <option value="M">ชาย (Male)</option>
                                <option value="F" selected>หญิง (Female)</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between bg-slate-900/80 px-3 py-2.5 rounded-lg border border-slate-700">
                            <span class="text-[11px] text-slate-300">รหัสบุคคล (Kua Number):</span>
                            <span id="kuaDisplay" class="text-lg font-bold text-yellow-400 bg-slate-800 w-8 h-8 flex items-center justify-center rounded-full border border-yellow-500/50">8</span>
                        </div>
                    </div>
                </div>

                <div class="space-y-2 pb-8">
                    <label class="block text-[11px] font-medium text-slate-300 border-b border-slate-700 pb-1">โหมดแสดงผลหน้าปัด (View Mode)</label>
                    <div class="flex flex-col gap-1.5 pt-1">
                        <button class="layer-btn active px-3 py-2.5 bg-slate-800 border border-yellow-600 text-yellow-400 rounded-lg text-[12px] text-left transition-all flex items-center gap-2" data-layer="TIME"><span class="text-red-400">🕒</span> แสดงทิศร้ายกาลเวลา (Afflictions)</button>
                        <button class="layer-btn px-3 py-2.5 bg-slate-900 border border-slate-700 text-slate-400 hover:bg-slate-800 rounded-lg text-[12px] text-left transition-all flex items-center gap-2" data-layer="KUA"><span class="text-emerald-400">👤</span> เฉพาะทิศมงคลบุคคล (8 Mansions)</button>
                        <button class="layer-btn px-3 py-2.5 bg-slate-900 border border-slate-700 text-slate-400 hover:bg-slate-800 rounded-lg text-[12px] text-left transition-all flex items-center gap-2" data-layer="STARS"><span class="text-blue-400">⭐</span> เฉพาะดาวเหิน (Flying Stars)</button>
                        <button class="layer-btn px-3 py-2.5 bg-slate-900 border border-slate-700 text-slate-400 hover:bg-slate-800 rounded-lg text-[12px] text-left transition-all flex items-center gap-2" data-layer="64GUA"><span class="text-indigo-400">☯️</span> ผัง 64 ข่วย (Xuan Kong Da Gua)</button>
                    </div>
                </div>
            </div>

            <!-- Tab Content: Analysis (Layout 2 ฝั่ง) -->
            <div id="tab-analysis" class="p-3 hidden flex-1 h-full overflow-hidden">
                <div class="grid grid-cols-2 gap-3 h-full">
                    
                    <!-- ฝั่งซ้าย: รูปดวง 4 เสา (BaZi Chart) -->
                    <div class="flex flex-col gap-3 overflow-y-auto pr-1 pb-4">
                        <!-- Time BaZi -->
                        <div class="bg-slate-800/60 rounded-xl p-2 border border-slate-600/50 shadow-inner">
                            <h3 class="text-[10px] font-bold text-yellow-400 mb-2 flex items-center gap-1 border-b border-slate-700 pb-1">🕒 กาลเวลาจร</h3>
                            <!-- 4 Pillars Container (ปี เดือน วัน ยาม) เรียงจากซ้ายไปขวาเพื่อง่ายต่อการอ่าน -->
                            <div class="grid grid-cols-4 gap-1" id="timeBaziPanel"></div>
                        </div>
                        
                        <!-- Person BaZi -->
                        <div class="bg-slate-800/60 rounded-xl p-2 border border-slate-600/50 shadow-inner">
                            <h3 class="text-[10px] font-bold text-emerald-400 mb-2 flex items-center gap-1 border-b border-slate-700 pb-1">👤 ดวงบุคคล</h3>
                            <div class="grid grid-cols-4 gap-1" id="personBaziPanel"></div>
                        </div>
                    </div>

                    <!-- ฝั่งขวา: สรุปฤกษ์และทิศร้าย (Advice & Afflictions) -->
                    <div class="bg-red-950/40 border border-red-900/60 rounded-xl p-2.5 flex flex-col h-full shadow-inner relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-16 h-16 bg-red-600/10 rounded-full blur-xl pointer-events-none"></div>
                        <h3 class="text-[11px] font-bold text-red-400 mb-2 flex items-center gap-1.5 border-b border-red-900/50 pb-1">
                            <span>⚠️</span> สรุปทิศร้ายกาลเวลา
                        </h3>
                        <div id="afflictionSummary" class="text-[9px] text-slate-300 space-y-2 flex-1 overflow-y-auto pr-1 pb-4">
                            <!-- Injected by JS -->
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Live Degree Display Box & Advice Box -->
        <div id="degreeDisplay" class="absolute z-20 flex flex-col items-center pointer-events-none transition-opacity duration-300 w-full left-1/2">
            <!-- Advice Box -->
            <div id="dirAdvice" class="mb-2 bg-white/95 backdrop-blur-sm border-2 border-slate-300 rounded-xl px-4 py-2 shadow-[0_10px_25px_rgba(0,0,0,0.5)] text-center w-max max-w-[85vw] transition-all duration-300 pointer-events-auto opacity-0 scale-95 origin-bottom hidden flex flex-col items-center justify-end">
                <div id="adviceTitle" class="text-black font-bold text-[11px] tracking-wide leading-tight mb-1"></div>
                <div id="adviceRemedy" class="text-slate-700 text-[10px] leading-tight font-medium"></div>
            </div>

            <!-- Main Black Degree Box -->
            <div class="bg-slate-900/95 backdrop-blur-md border border-yellow-500/80 rounded-xl px-2.5 py-1 shadow-[0_8px_30px_rgba(0,0,0,0.8)] text-center relative pointer-events-auto scale-90">
                <div class="absolute -bottom-1.5 left-1/2 transform -translate-x-1/2 w-3 h-3 bg-slate-900 border-b border-r border-yellow-500/80 rotate-45 z-10"></div>
                
                <!-- หัวลูกศรสีแดงชี้ทิศหน้าตรง (เพิ่มใหม่ตามคำสั่ง) -->
                <div class="absolute -bottom-[1.1rem] left-1/2 transform -translate-x-1/2 text-red-600 drop-shadow-[0_2px_4px_rgba(0,0,0,1)] pointer-events-none">
                    <svg class="w-[18px] h-[22px]" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 24L2 8h20L12 24z" />
                    </svg>
                </div>

                <span id="degreeValue" class="text-yellow-400 font-bold text-sm font-mono relative z-20 drop-shadow-md tracking-wider">0.0°</span>
                <div id="dirLabel" class="text-slate-300 text-[8px] font-semibold mt-0 relative z-20 uppercase tracking-wider">เหนือ (N)</div>
            </div>
        </div>

        <!-- Status Badge & Legend -->
        <div class="absolute bottom-[4.5rem] w-full flex justify-center pointer-events-none z-10">
            <div id="statusBadge" class="bg-slate-900/95 backdrop-blur-md border border-slate-700 rounded-2xl px-5 py-3 text-[11px] text-center shadow-[0_10px_30px_rgba(0,0,0,0.8)] font-medium tracking-wide w-[90%] max-w-sm pointer-events-auto transition-opacity">
            </div>
        </div>

        <!-- Manual Rotation Slider -->
        <div id="manualRotationControl" class="absolute bottom-5 w-full px-8 flex flex-col items-center pointer-events-none z-20">
            <label class="text-[10px] text-yellow-400 mb-1.5 font-medium bg-slate-900/90 px-3 py-1 rounded-full border border-yellow-600/30 shadow-lg pointer-events-auto flex items-center gap-1.5">👆 เลื่อนปรับองศาจานหล่อแก</label>
            <input type="range" id="manualDegree" min="0" max="360" step="0.1" value="0" class="w-full max-w-md pointer-events-auto bg-slate-700 rounded-lg h-2.5 appearance-none shadow-inner border border-slate-600">
        </div>

        <!-- Image Edit Controls Panel -->
        <div id="imageEditPanel" class="hidden absolute bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-md p-5 rounded-t-3xl z-50 text-slate-200 text-[11px] shadow-[0_-15px_50px_rgba(0,0,0,0.9)] border-t border-slate-700 pointer-events-auto transition-transform">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
               <span class="font-bold text-yellow-400 text-sm flex items-center gap-2">📐 เครื่องมือแก้ภาพเบี้ยว (Perspective)</span>
               <button id="closeImageEditBtn" class="text-white font-bold bg-indigo-600 px-4 py-1.5 rounded-lg hover:bg-indigo-500 shadow-lg">เสร็จสิ้น</button>
            </div>
            <div class="grid grid-cols-2 gap-x-6 gap-y-4">
                <div><label class="flex justify-between text-yellow-300 font-medium mb-1"><span>ขนาด (Zoom)</span><span id="valImgScale">1.0</span></label><input type="range" id="imgScale" min="0.1" max="5" step="0.05" value="1" class="w-full h-2"></div>
                <div><label class="flex justify-between text-yellow-300 font-medium mb-1"><span>หมุน (Rotate)</span><span id="valImgRotZ">0°</span></label><input type="range" id="imgRotZ" min="-180" max="180" step="0.5" value="0" class="w-full h-2"></div>
                <div><label class="flex justify-between text-indigo-300 font-medium mb-1"><span>เบี้ยวบน-ล่าง (Tilt Y)</span><span id="valImgRotX">0°</span></label><input type="range" id="imgRotX" min="-60" max="60" step="0.5" value="0" class="w-full h-2"></div>
                <div><label class="flex justify-between text-indigo-300 font-medium mb-1"><span>เบี้ยวซ้าย-ขวา (Tilt X)</span><span id="valImgRotY">0°</span></label><input type="range" id="imgRotY" min="-60" max="60" step="0.5" value="0" class="w-full h-2"></div>
                <div><label class="flex justify-between text-emerald-300 font-medium mb-1"><span>เลื่อนซ้าย-ขวา (Pan X)</span><span id="valImgPosX">0</span></label><input type="range" id="imgPosX" min="-15" max="15" step="0.1" value="0" class="w-full h-2"></div>
                <div><label class="flex justify-between text-emerald-300 font-medium mb-1"><span>เลื่อนขึ้น-ลง (Pan Y)</span><span id="valImgPosY">0</span></label><input type="range" id="imgPosY" min="-15" max="15" step="0.1" value="0" class="w-full h-2"></div>
            </div>
            <div class="mt-4 flex justify-end">
                <button id="resetImgBtn" class="text-[10px] text-slate-400 hover:text-white underline">รีเซ็ตค่าเริ่มต้น (Reset)</button>
            </div>
        </div>
    </div>

    <script>
        // --- ฐานข้อมูล 5 ธาตุ ราศีบน-ล่าง (Stems & Branches) พร้อมสี ---
        const ganData = [
            { char: '甲', th: 'เจี่ย', el: 'ไม้', color: 'text-emerald-400', bg: 'bg-emerald-900/30', border: 'border-emerald-500/30' },
            { char: '乙', th: 'อี่', el: 'ไม้', color: 'text-emerald-400', bg: 'bg-emerald-900/30', border: 'border-emerald-500/30' },
            { char: '丙', th: 'ปิ่ง', el: 'ไฟ', color: 'text-red-400', bg: 'bg-red-900/30', border: 'border-red-500/30' },

        els.targetDate.value = (new Date(Date.now() - tzOffset)).toISOString().slice(0, 16);
        
        const savedBirthDate = localStorage.getItem('luopan_birthDate');
        const savedGender = localStorage.getItem('luopan_gender');

        els.birthDate.addEventListener('change', (e) => { localStorage.setItem('luopan_birthDate', e.target.value); calculateAll(); });

        // ห้ามลบฟังก์ชันเดิม: ฟังก์ชันประมาณค่าปฏิทินจีนแบบดั้งเดิม (Fallback)
        function getPillars(dt) {
            const y = dt.getFullYear(); const yBranch = (y - 4) % 12;
            const m = dt.getMonth() + 1; const d = dt.getDate(); const hour = dt.getHours();
            let mBranch = (m + 1) % 12; 
            const jd = Math.floor(dt.getTime() / 86400000) + 2440588; const dBranch = (jd + 1) % 12;
            const hBranch = Math.floor((hour + 1) % 24 / 2);
            return { year: yBranch, month: mBranch, day: dBranch, hour: hBranch };
        }

        // ฟังก์ชันใหม่: ดึง 4 เสา (BaZi) แบบแม่นยำ 100% พร้อม Override ให้เปลี่ยนปีที่วันตงจื้อ (Winter Solstice)
        function getExactPillars(dt) {
            try {
                if (typeof Solar !== 'undefined' && typeof Lunar !== 'undefined') {
                    const solar = Solar.fromDate(dt);
                    const lunar = solar.getLunar();
                    const bazi = lunar.getEightChar();
                    
                    // ดึงราศีเบื้องต้น (ยึดตามลี่ชุนปกติ)
                    let yGan = bazi.getYearGan(); let yZhi = bazi.getYearZhi();
                    let mGan = bazi.getMonthGan(); let mZhi = bazi.getMonthZhi();
                    let dGan = bazi.getDayGan(); let dZhi = bazi.getDayZhi();
                    let hGan = bazi.getTimeGan(); let hZhi = bazi.getTimeZhi();

                    // --- ตรรกะพิเศษ: การเปลี่ยนปีนักษัตรที่วันตงจื้อ (21-22 ธ.ค.) ---
                    let baziYear = lunar.getYear(); // ปีจันทรคติปกติของมัน
                    // ดึงค่าตงจื้อของปีสุริยคติปัจจุบัน เพื่อเช็คว่าเลยวันนั้นมาหรือยัง
                    let dzSolar = Lunar.fromDate(new Date(solar.getYear(), 11, 15)).getJieQiTable()['冬至'];
                    let isAfterDongzhi = false;
                    
                    if (dzSolar && solar.getJulianDay() >= dzSolar.getJulianDay()) {
                        isAfterDongzhi = true; // เลยตงจื้อของปีนี้มาแล้ว
                    }
                    
                    let isBeforeLiChun = (solar.getYear() > baziYear); // อยู่ในช่วง ม.ค.-ก.พ. ก่อนลี่ชุน

                    if (isAfterDongzhi || isBeforeLiChun) {
                        // บังคับปัดปีนักษัตรขึ้น 1 ปี เพราะถือว่าเข้าหยางใหม่แล้ว
                        baziYear += 1;
                        let yGanIdx = (baziYear - 4) % 10; if (yGanIdx < 0) yGanIdx += 10;
                        let yZhiIdx = (baziYear - 4) % 12; if (yZhiIdx < 0) yZhiIdx += 12;
                        
                        yGan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'][yGanIdx];
                        yZhi = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'][yZhiIdx];

                        // คำนวณราศีบนของเดือน (ชวด/ฉลู) ใหม่ ตามวิชา 5 พยัคฆ์ (อิงปีใหม่)
                        if (mZhi === '子' || mZhi === '丑') {
                            let mZhiIdx = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'].indexOf(mZhi);
                            let yinStemIdx = ((yGanIdx % 5) + 1) * 2 % 10; 
                            let mGanIdx = (yinStemIdx + (mZhiIdx - 2 + 12)) % 10;
                            mGan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'][mGanIdx];
                        }
                    }

                    const getZhiIdx = (c) => ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'].indexOf(c);
                    const getGanIdx = (c) => ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'].indexOf(c);

                    // ส่งคืน Object แบบเดิม (เพื่อไม่ให้โค้ดเก่าพัง) + ส่งกิ่งก้าน (bazi) แนบไปสร้าง UI ใหม่
                    return {
                        year: getZhiIdx(yZhi), month: getZhiIdx(mZhi), day: getZhiIdx(dZhi), hour: getZhiIdx(hZhi),
                        bazi: { yg: getGanIdx(yGan), yz: getZhiIdx(yZhi), mg: getGanIdx(mGan), mz: getZhiIdx(mZhi), dg: getGanIdx(dGan), dz: getZhiIdx(dZhi), hg: getGanIdx(hGan), hz: getZhiIdx(hZhi) }
                    };
                }
            } catch (e) { console.warn("Lunar library failed, falling back.", e); }
            
            // กรณีออฟไลน์/ไลบรารีพัง วิ่งกลับไปฟังก์ชันเดิมของคุณทันที
            let fallback = getPillars(dt);
            // แนบ Mock Object ให้ UI 2 ฝั่งทำงานต่อได้โดยไม่ Error
            fallback.bazi = { yg: 0, yz: fallback.year, mg: 0, mz: fallback.month, dg: 0, dz: fallback.day, hg: 0, hz: fallback.hour };
            return fallback;
        }

        function calculateAll() {
            state.date = new Date(els.targetDate.value); state.birthDate = new Date(els.birthDate.value); state.gender = els.gender.value;
            
            // ใช้ฟังก์ชันใหม่ที่ครอบของเดิมไว้แล้ว
            state.calc.timeBazi = getExactPillars(state.date);
            state.calc.personBazi = getExactPillars(state.birthDate);

            // Kua (อิงจาก Person BaZi)
            const by = state.birthDate.getFullYear();
            let sum = by.toString().split('').reduce((a, b) => a + parseInt(b), 0);
            while (sum > 9) sum = sum.toString().split('').reduce((a, b) => a + parseInt(b), 0);
            let kua = state.gender === 'M' ? 11 - sum : 4 + sum;
            if (kua > 9) kua -= 9; if (kua === 5) kua = state.gender === 'M' ? 2 : 8;
            state.calc.kua = kua; els.kuaDisplay.innerText = kua;

            const kuaGroups = { east: [1, 3, 4, 9], west: [2, 6, 7, 8] }; const dirGroups = { east: ['N', 'S', 'E', 'SE'], west: ['W', 'NW', 'SW', 'NE'] };
            const group = kuaGroups.east.includes(kua) ? 'east' : 'west';
            state.calc.auspiciousDirs = dirGroups[group]; state.calc.inauspiciousDirs = dirGroups[group === 'east' ? 'west' : 'east'];

            // Afflictions
            const getAffliction = (branchIdx) => {
                const clash = (branchIdx + 6) % 12; const trines = [[8,0,4], [11,3,7], [2,6,10], [5,9,1]];
                let ssStart = 0, ssEnd = 0, ssName = '';
                if(trines[0].includes(branchIdx)) { ssStart = 135; ssEnd = 225; ssName = 'ใต้'; } 
                else if(trines[1].includes(branchIdx)) { ssStart = 225; ssEnd = 315; ssName = 'ตะวันตก'; } 
                else if(trines[2].includes(branchIdx)) { ssStart = 315; ssEnd = 45; ssName = 'เหนือ'; } 
                else if(trines[3].includes(branchIdx)) { ssStart = 45; ssEnd = 135; ssName = 'ตะวันออก'; } 
                return { clash, ssStart, ssEnd, ssName };
            };
            ['year', 'month', 'day', 'hour'].forEach(p => { state.calc.afflictions[p] = getAffliction(state.calc.timeBazi[p]); });

            // Flying Stars
        const diff = state.date.getFullYear() - 2024; let centerStar = 3 - (diff % 9); if (centerStar <= 0) centerStar += 9;
        const luoShuPath = ['Center', 'NW', 'W', 'NE', 'S', 'N', 'SW', 'E', 'SE']; const yearStars = {};
        let currentStar = centerStar;
        luoShuPath.forEach(dir => { if (dir !== 'Center') yearStars[dir] = currentStar; currentStar = currentStar === 9 ? 1 : currentStar + 1; });
        state.calc.stars = { year: yearStars, center: centerStar };

        updateUI(); updateStatusBadge(); updateAdviceBox(state.currentDegree); draw2DTexture();
    }

            // กำหนดสีพื้นหลังให้โปร่งแสง 60% (Alpha 0.6) เมื่อเปิดโหมด AR
            const bgGua = isARTransparent ? 'rgba(10, 15, 29, 0.6)' : '#0a0f1d';
            const bgMain = isARTransparent ? 'rgba(15, 23, 42, 0.6)' : '#0f172a';
            const centerFill = isARTransparent ? 'rgba(15, 23, 42, 0.6)' : '#0f172a';

            if (state.is64GuaMode || state.viewMode === '64GUA') {
                ctx.beginPath(); ctx.arc(0,0, rTicks, 0, 2*Math.PI); ctx.fillStyle = bgGua; ctx.fill(); const ringColor = 'rgba(212,175,55,0.4)';
                for(let i = 0; i < 64; i++) { drawSeg(rDir, rTicks, i*(360/64), (i+1)*(360/64), 'transparent', ringColor, 1.5); let hexagramUnicode = String.fromCharCode(0x4DC0 + i); drawTxt(hexagramUnicode, rDir + (rTicks-rDir)*0.6, i*(360/64) + (360/128), '#fcd34d', `900 ${baseFontSize*1.5}px Arial`, 'transparent'); }
                const trigrams = ['☰', '☴', '☵', '☶', '☷', '☳', '☲', '☱'];
                for(let i = 0; i < 8; i++) { drawSeg(rStar, rDir, i*45-22.5, i*45+22.5, 'transparent', ringColor, 2); drawTxt(trigrams[i], rStar + (rDir-rStar)*0.5, i*45, '#d4af37', `900 ${baseFontSize*2}px Arial`, 'transparent'); }
                drawSeg(rTai, rStar, 0, 360, 'transparent', ringColor, 2); drawTxt("ผัง 64 ข่วย", rTai * 1.6, 0, '#ffffff', `600 ${baseFontSize*0.6}px Prompt`, 'rgba(0,0,0,0.8)', 6);
            } else {
                ctx.beginPath(); ctx.arc(0,0, rTicks, 0, 2*Math.PI); ctx.fillStyle = bgMain; ctx.fill(); const ringColor = 'rgba(212,175,55,0.4)';
                for(let i = 0; i < 24; i++) drawSeg(rBrn, rTicks, i*15-7.5, i*15+7.5, 'transparent', ringColor, 2);
                for(let i = 0; i < 12; i++) drawSeg(rDir, rBrn, i*30-15, i*30+15, 'transparent', ringColor, 2);
                for(let i = 0; i < 8; i++) drawSeg(rStar, rDir, i*45-22.5, i*45+22.5, 'transparent', ringColor, 2);
                drawSeg(rTai, rStar, 0, 360, 'transparent', ringColor, 2); 
                
                const vm = state.viewMode; const activeSuiPos = []; let activeSanShas = [];
                if (vm === 'TIME') { Object.keys(state.toggles).filter(k => state.toggles[k]).forEach(p => { const aff = state.calc.afflictions[p]; activeSuiPos.push({ branch: aff.clash, p: p }); activeSanShas.push(aff); }); }

                mountains24.forEach((m) => { const txt = m.name.split(' '); drawTxt(txt[0], rBrn + (rTicks - rBrn) * 0.70, m.deg, '#cbd5e1', `bold ${baseFontSize * 0.65}px Arial`, 'transparent'); drawTxt(txt[1], rBrn + (rTicks - rBrn) * 0.35, m.deg, '#ffffff', `600 ${baseFontSize * 0.9}px Prompt`, 'transparent'); });

                for (let i = 0; i < 12; i++) {
                    const clashData = activeSuiPos.filter(a => a.branch === i);
                    if (clashData.length > 0 && vm === 'TIME') { const pulse = 0.5 + Math.sin(Date.now() / 150) * 0.4; const branchBgColor = `rgba(239, 68, 68, ${pulse})`; drawSeg(rDir, rBrn, i*30-15, i*30+15, branchBgColor, '#ef4444', 4); }
                    drawTxt(branches[i].char, rDir + (rBrn - rDir) * 0.70, i * 30, '#ffffff', `bold ${innerFontSize * 1.3}px Arial`, 'transparent');
                    drawTxt(branches[i].name.split(' ')[0], rDir + (rBrn - rDir) * 0.35, i * 30, '#ffffff', `600 ${innerFontSize * 2.3}px Prompt`, 'transparent');
                }

                Object.keys(dirs8).forEach(k => {
                    const d = dirs8[k]; let mid = (d.start + d.end) / 2; if (d.start > d.end) mid = (d.start + d.end + 360) / 2;
                    let engColor = '#d4af37'; let thColor = '#94a3b8';
                    if (vm === 'KUA') {
                        if (state.calc.auspiciousDirs.includes(k)) { engColor = '#10b981'; thColor = '#10b981'; drawSeg(rStar, rDir, d.start, d.end, 'rgba(16, 185, 129, 0.15)', '#10b981', 4); } 
                        else if (state.calc.inauspiciousDirs.includes(k)) { engColor = '#ef4444'; thColor = '#ef4444'; drawSeg(rStar, rDir, d.start, d.end, 'rgba(239, 68, 68, 0.15)', '#ef4444', 4); }
                    }
                    drawTxt(k, rStar + (rDir - rStar) * 0.72, mid, engColor, `900 ${innerFontSize * 1.75}px Arial`, 'transparent');
                    const thSize = d.name.length > 7 ? innerFontSize * 1.15 : innerFontSize * 1.6; drawTxt(d.name, rStar + (rDir - rStar) * 0.28, mid, thColor, `500 ${thSize}px Prompt`, 'transparent');
                });

                if (vm === 'STARS') {
                    Object.keys(dirs8).forEach(k => {
                        const d = dirs8[k]; let mid = (d.start + d.end) / 2; if (d.start > d.end) mid = (d.start + d.end + 360) / 2;
                        const starNum = state.calc.stars.year[k];
                        let sCol = '#94a3b8'; let bgCol = 'rgba(148, 163, 184, 0.15)'; 
                        if ([9, 1, 8].includes(starNum)) { sCol = '#4ade80'; bgCol = 'rgba(74, 222, 128, 0.15)'; } if ([2, 7, 3].includes(starNum)) { sCol = '#f87171'; bgCol = 'rgba(248, 113, 113, 0.15)'; } if (starNum === 5) { sCol = '#facc15'; bgCol = 'rgba(250, 204, 21, 0.15)'; } 
                        drawSeg(rTai, rStar, d.start, d.end, bgCol, 'transparent'); const starRad = rTai + (rStar - rTai) * 0.5;
                        ctx.save(); ctx.rotate((mid - 90) * Math.PI / 180); ctx.translate(starRad, 0); ctx.rotate(Math.PI / 2);
                        ctx.beginPath(); ctx.arc(0, 0, innerFontSize * 1.8, 0, 2*Math.PI); ctx.strokeStyle = sCol; ctx.lineWidth = 3; ctx.fillStyle = centerFill; ctx.fill(); ctx.stroke();
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = sCol; ctx.font = `900 ${innerFontSize * 2.2}px Arial`; ctx.fillText(starNum, 0, 0); ctx.restore();
                    });
                }

                if (vm === 'TIME') {
                    activeSanShas.forEach(aff => {
                        ctx.beginPath(); const ssSRad = (aff.ssStart - 90) * Math.PI / 180; let ssERad = (aff.ssEnd - 90) * Math.PI / 180;
                        if (ssERad < ssSRad) ssERad += 2 * Math.PI; ctx.arc(0, 0, rTicks - 6, ssSRad, ssERad); ctx.strokeStyle = '#f97316'; ctx.lineWidth = 12; ctx.stroke();
                    });
                }
            }
            
            ctx.beginPath(); ctx.arc(0, 0, rTai, 0, 2*Math.PI); ctx.fillStyle = centerFill; ctx.fill(); const tj = rTai * 0.8;
            ctx.beginPath(); ctx.arc(0, 0, tj, Math.PI/2, Math.PI*1.5); ctx.fillStyle = '#ffffff'; ctx.fill();
            ctx.beginPath(); ctx.arc(0, 0, tj, Math.PI*1.5, Math.PI/2); ctx.fillStyle = '#000000'; ctx.fill();
            ctx.beginPath(); ctx.arc(0, -tj/2, tj/2, 0, 2*Math.PI); ctx.fillStyle = '#ffffff'; ctx.fill();
            ctx.beginPath(); ctx.arc(0, tj/2, tj/2, 0, 2*Math.PI); ctx.fillStyle = '#000000'; ctx.fill();
            ctx.beginPath(); ctx.arc(0, -tj/2, tj/6, 0, 2*Math.PI); ctx.fillStyle = '#000000'; ctx.fill();
            ctx.beginPath(); ctx.arc(0, tj/2, tj/6, 0, 2*Math.PI); ctx.fillStyle = '#ffffff'; ctx.fill();
            ctx.restore(); texture.needsUpdate = true;
        }

        function getDirectionData(deg) { for (let k in dirs8) { let d = dirs8[k]; if (d.start > d.end) { if (deg >= d.start || deg <= d.end) return { code: k, name: d.name }; } else { if (deg >= d.start && deg <= d.end) return { code: k, name: d.name }; } } return { code: 'N', name: 'เหนือ' }; }

        function updateAdviceBox(deg) {
            const dirData = getDirectionData(deg); const dirCode = dirData.code; els.dirLabel.innerText = `${dirData.name} (${dirCode})`; els.degreeValue.innerText = deg.toFixed(1) + '°';
            let title = "", remedy = "", hasBad = false;

            if (state.is64GuaMode || state.viewMode === '64GUA') {
                const guaWidth = 5.625; const margin = 0.5; const boundaryDistance = deg % guaWidth; const isKongWang = boundaryDistance <= margin || (guaWidth - boundaryDistance) <= margin;
                if (isKongWang) {
                    title = "⚠️ ระวัง! ทับเส้นแบ่งข่วย (เส้นมรณะ)"; remedy = "พลังงานปะทะกันอย่างรุนแรง ห้ามเคาะเจาะทุบ ตั้งประตู โต๊ะทำงาน หรือเตียงนอน ทับองศานี้เด็ดขาด";
                    els.dirAdvice.classList.replace('border-slate-300', 'border-red-500'); els.dirAdvice.classList.replace('border-indigo-500', 'border-red-500'); els.adviceTitle.className = 'font-bold text-[11px] tracking-wide leading-tight mb-1 text-red-600';
                } else {
                    let guaIndex = Math.floor(deg / guaWidth) % 64; let guaData = gua64Info[guaIndex].split('|'); title = `☯️ ข่วย${guaData[0]}`; remedy = guaData[1];
                    els.dirAdvice.classList.replace('border-red-500', 'border-indigo-500'); els.dirAdvice.classList.replace('border-slate-300', 'border-indigo-500'); els.adviceTitle.className = 'font-bold text-[11px] tracking-wide leading-tight mb-1 text-indigo-600';
                }
            } else if (state.viewMode === 'STARS') {
                const starNum = state.calc.stars.year[dirCode];
                if (starNum) {
                    title = starsInfo[starNum].desc; remedy = starsInfo[starNum].remedy;
                    if(starsInfo[starNum].type === 'fatal') { els.dirAdvice.classList.replace('border-slate-300', 'border-red-500'); els.dirAdvice.classList.replace('border-indigo-500', 'border-red-500'); els.adviceTitle.className = 'font-bold text-[11px] tracking-wide leading-tight mb-1 text-red-600'; hasBad = true; } 
                    else if (starsInfo[starNum].type === 'bad') { els.dirAdvice.classList.replace('border-slate-300', 'border-orange-500'); els.dirAdvice.classList.replace('border-indigo-500', 'border-orange-500'); els.adviceTitle.className = 'font-bold text-[11px] tracking-wide leading-tight mb-1 text-orange-600'; } 
                    else { els.dirAdvice.classList.replace('border-red-500', 'border-slate-300'); els.dirAdvice.classList.replace('border-orange-500', 'border-slate-300'); els.dirAdvice.classList.replace('border-indigo-500', 'border-slate-300'); els.adviceTitle.className = 'font-bold text-[11px] tracking-wide leading-tight mb-1 text-emerald-600'; }
                }
            } else if (state.viewMode === 'KUA') {
                if (state.calc.auspiciousDirs.includes(dirCode)) { title = "ทิศมงคลประจำตัว"; remedy = "ส่งเสริมโชคลาภ สุขภาพ ความสัมพันธ์"; els.adviceTitle.className = 'font-bold text-[11px] tracking-wide leading-tight mb-1 text-emerald-600'; } 
                else { title = "ทิศร้ายประจำตัว"; remedy = "หลีกเลี่ยงการหันหัวเตียง หรือโต๊ะทำงาน"; els.dirAdvice.classList.replace('border-slate-300', 'border-red-500'); els.dirAdvice.classList.replace('border-indigo-500', 'border-red-500'); els.adviceTitle.className = 'font-bold text-[11px] tracking-wide leading-tight mb-1 text-red-600'; hasBad = true; }
                if(!hasBad) { els.dirAdvice.classList.replace('border-red-500', 'border-slate-300'); els.dirAdvice.classList.replace('border-indigo-500', 'border-slate-300'); }
            } else if (state.viewMode === 'TIME') {
                let badTitle = []; let currentBranch = Math.floor((deg + 15) % 360 / 30);
                Object.keys(state.toggles).filter(k=>state.toggles[k]).forEach(p => {
                     const aff = state.calc.afflictions[p]; const thName = (p==='year'?'ปี':p==='month'?'เดือน':p==='day'?'วัน':'ยาม');
                     if(aff.clash === currentBranch) badTitle.push(`ทิศชง(${thName})`);
                     let inSS = false; if(aff.ssStart > aff.ssEnd) { if(deg >= aff.ssStart || deg <= aff.ssEnd) inSS = true; } else { if(deg >= aff.ssStart && deg <= aff.ssEnd) inSS = true; }
                     if(inSS) badTitle.push(`ทิศอสูร(${thName})`);
                });
                if(badTitle.length > 0) { title = "⚠️ " + badTitle.join(', '); remedy = "ห้ามเคาะ เจาะ ทุบ ตอก ซ่อมแซม ในทิศนี้เด็ดขาด!"; els.dirAdvice.classList.replace('border-slate-300', 'border-red-500'); els.dirAdvice.classList.replace('border-indigo-500', 'border-red-500'); els.adviceTitle.className = 'font-bold text-[11px] tracking-wide leading-tight mb-1 text-red-600'; hasBad = true; } 
                else { title = "ทิศปกติ (กาลเวลาจร)"; remedy = "ไม่มีดาวร้ายจรปะทะ สามารถใช้งานได้ปกติ"; els.dirAdvice.classList.replace('border-red-500', 'border-slate-300'); els.dirAdvice.classList.replace('border-indigo-500', 'border-slate-300'); els.adviceTitle.className = 'font-bold text-[11px] tracking-wide leading-tight mb-1 text-slate-700'; }
            }

            if(title) { els.adviceTitle.innerText = title; els.adviceRemedy.innerText = remedy; els.dirAdvice.classList.remove('hidden'); setTimeout(() => { els.dirAdvice.classList.remove('opacity-0', 'scale-95'); els.dirAdvice.classList.add('opacity-100', 'scale-100'); }, 50); } 
            else { els.dirAdvice.classList.add('opacity-0', 'scale-95'); setTimeout(() => els.dirAdvice.classList.add('hidden'), 300); }
        }

        let targetDegree = 0; let displayDegree = 0;
        function lerpAngle(start, end, amount) { let difference = Math.abs(end - start); if (difference > 180) { if (end > start) start += 360; else end += 360; } let value = (start + ((end - start) * amount)); return (value >= 0 && value < 360) ? value : value % 360; }
        function handleOrientation(event) { if (!state.isCompassActive) return; let compass = event.webkitCompassHeading || Math.abs(event.alpha - 360); if (compass !== null) targetDegree = compass; }
        els.compassBtn.addEventListener('click', async () => {
            if (!state.isCompassActive) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try { const permission = await DeviceOrientationEvent.requestPermission(); if (permission === 'granted') { window.addEventListener('deviceorientation', handleOrientation); startCompass(); } else { alert("ต้องอนุญาตให้เข้าถึงเข็มทิศก่อนครับ"); } } catch (e) { alert(e); }
                } else { window.addEventListener('deviceorientationabsolute', handleOrientation); startCompass(); }
            } else { stopCompass(); }
        });
        function startCompass() { state.isCompassActive = true; els.compassBtn.classList.replace('bg-indigo-600/95', 'bg-red-600/95'); els.compassBtn.innerHTML = '<svg class="w-6 h-6 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>'; els.manualRotationControl.classList.add('hidden'); }
        function stopCompass() { state.isCompassActive = false; window.removeEventListener('deviceorientation', handleOrientation); window.removeEventListener('deviceorientationabsolute', handleOrientation); els.compassBtn.classList.replace('bg-red-600/95', 'bg-indigo-600/95'); els.compassBtn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>'; els.manualRotationControl.classList.remove('hidden'); els.manualDegree.value = displayDegree; }
        // แก้ไข: ถอดเครื่องหมายลบออกจาก displayDegree เพื่อให้จานหมุนถูกทิศ 100%
        els.manualDegree.addEventListener('input', (e) => { targetDegree = parseFloat(e.target.value); displayDegree = targetDegree; if(luopanMesh) luopanMesh.rotation.z = displayDegree * (Math.PI / 180); updateAdviceBox(displayDegree); state.currentDegree = displayDegree; });

        const video = document.getElementById('videoBackground');
        els.arBtn.addEventListener('click', async () => {
            if (!isARTransparent) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); video.srcObject = stream; video.style.display = 'block'; isARTransparent = true;
                    els.arBtn.classList.replace('bg-slate-800/95', 'bg-emerald-600/95'); els.arBtn.classList.replace('text-emerald-400', 'text-white'); document.body.style.backgroundColor = 'transparent';
                    els.importImgBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`; updateStatusBadge();
                } catch(err) { alert("ไม่สามารถเปิดกล้องได้: " + err.message); }
            } else {
                const stream = video.srcObject; if (stream) stream.getTracks().forEach(track => track.stop()); video.style.display = 'none'; isARTransparent = false;
                els.arBtn.classList.replace('bg-emerald-600/95', 'bg-slate-800/95'); els.arBtn.classList.replace('text-white', 'text-emerald-400'); document.body.style.backgroundColor = '#020617';
                els.importImgBtn.innerHTML = `<input type="file" id="imageInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>`; updateStatusBadge();
            }
            draw2DTexture();
        });

        function applyUserImage(src) {
            new THREE.TextureLoader().load(src, function(tex) {
                if(userImageMesh) scene.remove(userImageMesh); const aspect = tex.image.width / tex.image.height;
                userImageMesh = new THREE.Mesh(new THREE.PlaneGeometry(20, 20 / aspect), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
                userImageMesh.position.y = -1; userImageMesh.rotation.x = -Math.PI / 2; scene.add(userImageMesh); els.editImgBtn.classList.remove('hidden'); resetImgTransforms();
            });
        }
        document.body.addEventListener('change', (e) => { if(e.target && e.target.id === 'imageInput' && e.target.files[0]) { const reader = new FileReader(); reader.onload = (ev) => applyUserImage(ev.target.result); reader.readAsDataURL(e.target.files[0]); } });
        els.importImgBtn.addEventListener('click', (e) => { if(isARTransparent && video.readyState === video.HAVE_ENOUGH_DATA) { e.preventDefault(); const tempCanvas = document.createElement('canvas'); tempCanvas.width = video.videoWidth; tempCanvas.height = video.videoHeight; tempCanvas.getContext('2d').drawImage(video, 0, 0); applyUserImage(tempCanvas.toDataURL('image/jpeg')); els.arBtn.click(); } });
        els.editImgBtn.addEventListener('click', () => { els.imageEditPanel.classList.remove('hidden'); if(luopanMesh) luopanMesh.material.opacity = 0.3; });
        els.closeImageEditBtn.addEventListener('click', () => { els.imageEditPanel.classList.add('hidden'); if(luopanMesh) luopanMesh.material.opacity = 1.0; });

        function updateImageTransform() {
            if(!userImageMesh) return; const sc = parseFloat(els.imgScale.value); const rZ = parseFloat(els.imgRotZ.value); const rX = parseFloat(els.imgRotX.value); const rY = parseFloat(els.imgRotY.value); const pX = parseFloat(els.imgPosX.value); const pY = parseFloat(els.imgPosY.value);
            userImageMesh.scale.set(sc, sc, sc); userImageMesh.rotation.set(-Math.PI/2 + THREE.MathUtils.degToRad(rX), THREE.MathUtils.degToRad(rY), THREE.MathUtils.degToRad(rZ), 'ZXY'); userImageMesh.position.set(pX, -1, -pY); 
            els.valImgScale.innerText = sc.toFixed(2); els.valImgRotZ.innerText = rZ.toFixed(1) + '°'; els.valImgRotX.innerText = rX.toFixed(1) + '°'; els.valImgRotY.innerText = rY.toFixed(1) + '°'; els.valImgPosX.innerText = pX.toFixed(1); els.valImgPosY.innerText = pY.toFixed(1);
        }
        ['imgScale', 'imgRotZ', 'imgRotX', 'imgRotY', 'imgPosX', 'imgPosY'].forEach(id => els[id].addEventListener('input', updateImageTransform));
        function resetImgTransforms() { els.imgScale.value = 1; els.imgRotZ.value = 0; els.imgRotX.value = 0; els.imgRotY.value = 0; els.imgPosX.value = 0; els.imgPosY.value = 0; updateImageTransform(); }
        els.resetImgBtn.addEventListener('click', resetImgTransforms);

        function animate() {
            requestAnimationFrame(animate);
            if(state.viewMode === 'TIME' || state.is64GuaMode || state.viewMode === '64GUA') draw2DTexture(); 
            if (luopanMesh && state.isCompassActive) { displayDegree = lerpAngle(displayDegree, targetDegree, 0.15); luopanMesh.rotation.z = displayDegree * (Math.PI / 180); if(Math.abs(state.currentDegree - displayDegree) > 0.5) { updateAdviceBox(displayDegree); state.currentDegree = displayDegree; } }
            renderer.render(scene, camera);
        }

        calculateAll(); animate();
    </script>
